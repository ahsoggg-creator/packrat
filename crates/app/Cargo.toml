[package]
name = "packrat-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Packrat archive manager (GUI, installer, updater)"

[[bin]]
name = "Packrat"
path = "src/main.rs"

[dependencies]
packrat-core = { path = "../core" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.36.2"
encoding_rs = "0.8.42"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.4.2"
winreg = "0.56.0"
windows-core = "0.62"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_Graphics_Gdi"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3.27.0"
